[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartreco"
version = "0.1.0"
description = "Behavioral AI recommendation agent powered by Mesh API, RAG, and LangGraph"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

