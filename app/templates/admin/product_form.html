{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} product — ReCo{% endblock %}
{% block content %}<section class="shell admin-page narrow"><form class="form-card" method="post" action="{{ '/admin/products/' + product.id if product else '/admin/products' }}"><input type="hidden" name="csrf_token" value="{{ current_session.csrf_token }}"><span class="eyebrow">Catalog source of truth</span><h1>{{ 'Edit' if product else 'Add' }} product</h1><div class="form-grid"><label>Title<input name="title" value="{{ product.title if product else '' }}" required></label><label>Slug<input name="slug" value="{{ product.slug if product else '' }}" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></label><label class="wide">Description<textarea name="description" required rows="5">{{ product.description if product else '' }}</textarea></label><label>Category<input name="category" value="{{ product.category if product else '' }}" required></label><label>Level<select name="level">{% for level in ['Beginner','Intermediate','Advanced','All levels'] %}<option {{ 'selected' if product and product.level == level }}>{{ level }}</option>{% endfor %}</select></label><label class="wide">Skills, comma separated<input name="skills" value="{{ product.skills|join(', ') if product else '' }}"></label><label class="wide">Outcomes, comma separated<input name="outcomes" value="{{ product.outcomes|join(', ') if product else '' }}"></label><label>Price<input type="number" name="price" min="0" step="0.01" value="{{ product.price if product else 0 }}"></label><label>Currency<input name="currency" maxlength="3" value="{{ product.currency if product else 'USD' }}"></label><label>Duration, minutes<input type="number" name="duration_minutes" min="1" value="{{ product.duration_minutes if product else 120 }}"></label><label>Status<select name="status">{% for status in ['active','draft','archived'] %}<option {{ 'selected' if product and product.status == status }}>{{ status }}</option>{% endfor %}</select></label></div><button class="button" type="submit">Save and queue vector sync</button></form></section>{% endblock %}
